[workspace]
resolver = "2"
members = [
  "crates/foxvoice-contracts",
  "crates/foxvoice-engine",
  "crates/foxvoice-ipc",
  "crates/foxvoice-audio",
  "crates/foxvoice-models",
  "crates/foxvoice-supervisor",
  "crates/foxvoice-converter",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.99"
cpal = "0.18.2"
rtrb = "0.4.0"
sha2 = "0.10.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
